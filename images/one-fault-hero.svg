<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Four clinic doors, pain clinic, gastroenterology, rheumatology and psychiatry, each with its own diagnosis. One pink alarm signal that never dies down runs through all four.">
  <!-- one fault, many names: the same non-habituating signal behind every specialist's door -->
  <rect width="1600" height="900" fill="#e6defa"/>
  <rect x="120" y="120" width="300" height="560" rx="22" fill="#1b1b1b"/>
  <rect x="110" y="110" width="300" height="560" rx="22" fill="#ffffff" stroke="#1b1b1b" stroke-width="6"/>
  <rect x="138" y="140" width="244" height="70" rx="10" fill="#6cc8f0" stroke="#1b1b1b" stroke-width="4"/>
  <text x="260.0" y="186" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#1b1b1b">PAIN CLINIC</text>
  <text x="260.0" y="310" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="40" fill="#1b1b1b"><tspan x="260">“chronic</tspan><tspan x="260" dy="50">pain”</tspan></text>
  <circle cx="370" cy="625" r="13" fill="#1b1b1b"/>
  <rect x="480" y="120" width="300" height="560" rx="22" fill="#1b1b1b"/>
  <rect x="470" y="110" width="300" height="560" rx="22" fill="#ffffff" stroke="#1b1b1b" stroke-width="6"/>
  <rect x="498" y="140" width="244" height="70" rx="10" fill="#fbe919" stroke="#1b1b1b" stroke-width="4"/>
  <text x="620.0" y="186" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#1b1b1b">GASTRO</text>
  <text x="620.0" y="310" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="40" fill="#1b1b1b">“IBS”</text>
  <circle cx="730" cy="625" r="13" fill="#1b1b1b"/>
  <rect x="840" y="120" width="300" height="560" rx="22" fill="#1b1b1b"/>
  <rect x="830" y="110" width="300" height="560" rx="22" fill="#ffffff" stroke="#1b1b1b" stroke-width="6"/>
  <rect x="858" y="140" width="244" height="70" rx="10" fill="#f9a13c" stroke="#1b1b1b" stroke-width="4"/>
  <text x="980.0" y="186" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="25" font-weight="700" fill="#1b1b1b">RHEUMATOLOGY</text>
  <text x="980.0" y="310" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="36" fill="#1b1b1b">“autoimmune”</text>
  <circle cx="1090" cy="625" r="13" fill="#1b1b1b"/>
  <rect x="1200" y="120" width="300" height="560" rx="22" fill="#1b1b1b"/>
  <rect x="1190" y="110" width="300" height="560" rx="22" fill="#ffffff" stroke="#1b1b1b" stroke-width="6"/>
  <rect x="1218" y="140" width="244" height="70" rx="10" fill="#9b7fd4" stroke="#1b1b1b" stroke-width="4"/>
  <text x="1340.0" y="186" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#1b1b1b">PSYCHIATRY</text>
  <text x="1340.0" y="310" text-anchor="middle" font-family="Space Mono, IBM Plex Mono, Menlo, monospace" font-size="40" fill="#1b1b1b">“anxiety”</text>
  <circle cx="1450" cy="625" r="13" fill="#1b1b1b"/>

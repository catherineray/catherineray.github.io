<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mean field and correlation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --panel:rgba(255,255,255,.38); --ink:#1b1b1b; --muted:#4a3a63; --line:rgba(74,58,99,.22);
  --accent:#d12d88; --blue:#2a7fb8; --violet:#6a4cb0;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:2px;color:var(--ink);font-family:var(--mono)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color-scheme:light}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.row>*{min-width:0}
.fig{flex:1 1 300px;max-width:400px;margin:0 auto}
.side{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;font-size:.8rem;line-height:1.45}
svg{display:block;width:100%;height:auto}
label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.key{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:0;border-top:3px solid}
table{border-collapse:collapse;width:100%;font-size:.76rem}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:400}
.verdict{border-left:3px solid var(--accent);padding-left:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="row">
  <div class="fig">
    <svg id="plot" viewBox="0 0 400 400" role="img" aria-label="Two-channel Gaussian and its factorized approximations">
      <line x1="200" y1="10" x2="200" y2="390" stroke="rgba(74,58,99,.25)"/>
      <line x1="10" y1="200" x2="390" y2="200" stroke="rgba(74,58,99,.25)"/>
      <text x="386" y="192" font-size="11" text-anchor="end" fill="#4a3a63">skin deficit</text>
      <text x="208" y="20" font-size="11" fill="#4a3a63">gut deficit</text>
      <g id="dots"></g>
      <ellipse id="truth" cx="200" cy="200" fill="none" stroke="#d12d88" stroke-width="3"/>
      <circle id="fwd" cx="200" cy="200" fill="none" stroke="#6a4cb0" stroke-width="2" stroke-dasharray="6 5"/>
      <circle id="rev" cx="200" cy="200" fill="none" stroke="#2a7fb8" stroke-width="3"/>
    </svg>
  </div>
  <div class="side">
    <div>
      <label for="rho">How strongly skin and gut move together: <b id="rhov">0.80</b></label>
      <input id="rho" type="range" min="0" max="0.97" step="0.01" value="0.8">
    </div>
    <div class="key"><span class="sw" style="border-color:#d12d88"></span>the truth: one shared severity</div>
    <div class="key"><span class="sw" style="border-color:#2a7fb8"></span>mean-field fit, standard VI</div>
    <div class="key"><span class="sw" style="border-color:#6a4cb0;border-top-style:dashed"></span>mean-field fit, other divergence</div>
    <table>
      <tr><th></th><th>truth</th><th>VI</th><th>other</th></tr>
      <tr><td>correlation</td><td id="c0"></td><td>0</td><td>0</td></tr>
      <tr><td>variance</td><td>1.00</td><td id="v1"></td><td>1.00</td></tr>
      <tr><td>precision</td><td id="p0"></td><td id="p1"></td><td>1.00</td></tr>
      <tr><td>total spread</td><td id="d0"></td><td id="d1"></td><td>1.00</td></tr>
    </table>
    <div class="verdict" id="verdict"></div>
  </div>
</div>
</div>
<script>
(function(){
  var S = 100, cx = 200, cy = 200;
  var rho = document.getElementById('rho');
  // fixed standard-normal draws so the cloud reshapes smoothly
  var z = [], seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 160; i++) {
    var u = Math.max(rnd(), 1e-9), v = rnd();
    var r = Math.sqrt(-2 * Math.log(u));
    z.push([r * Math.cos(2 * Math.PI * v), r * Math.sin(2 * Math.PI * v)]);
  }
  var g = document.getElementById('dots'), pts = [];
  z.forEach(function(){
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', '2.2'); c.setAttribute('fill', 'rgba(209,45,136,.28)');
    g.appendChild(c); pts.push(c);
  });
  function f(x){ return x.toFixed(2); }
  function draw(){
    var p = parseFloat(rho.value), q = 1 - p * p;
    document.getElementById('rhov').textContent = f(p);
    // truth: covariance [[1,p],[p,1]]; 1-sd contour has semi-axes sqrt(1+p), sqrt(1-p) along the diagonals
    var e = document.getElementById('truth');
    e.setAttribute('rx', S * Math.sqrt(1 + p)); e.setAttribute('ry', S * Math.sqrt(1 - p));
    e.setAttribute('transform', 'rotate(-45 200 200)');
    // standard VI, KL(q||p): diagonal variances 1/precision_ii = 1 - p^2
    document.getElementById('rev').setAttribute('r', S * Math.sqrt(q));
    // KL(p||q): matches the marginal variances
    document.getElementById('fwd').setAttribute('r', S);
    var a = Math.sqrt(1 - p * p);
    z.forEach(function(w, i){
      var x = w[0], y = p * w[0] + a * w[1];
      pts[i].setAttribute('cx', cx + S * x); pts[i].setAttribute('cy', cy - S * y);
    });
    document.getElementById('c0').textContent = f(p);
    document.getElementById('v1').textContent = f(q);
    document.getElementById('p0').textContent = f(1 / q);
    document.getElementById('p1').textContent = f(1 / q);
    document.getElementById('d0').textContent = f(q);
    document.getElementById('d1').textContent = f(q * q);
    document.getElementById('verdict').textContent = p < 0.05
      ? 'With no shared factor, every fit is right.'
      : 'The truth is one shared severity. Both mean-field fits report skin and gut as unrelated (correlation 0), and each gets at most one of variance, precision and total spread right.';
  }
  rho.addEventListener('input', draw);
  draw();
})();
</script>
</body>
</html>

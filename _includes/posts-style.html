{% comment %} Styles shared by All posts (blog.html) and the genre pages (_layouts/genre.html): highlight cards, the post list, and the Recents tiles. {% endcomment %}
<style>
  .site-main #main.container { max-width: 1200px; }
  .ap { --ink: #1b1b1b; --soft: #4a3a63; --ink-soft: #4a3a63; --paper: #fff; --yellow: #fbe919; --pink: #ec3f9e; --lilac: #d5c2ef; }
  .ap-card-link { display: block; color: var(--ink); text-decoration: none; }
  .ap-card-actions { display: flex; flex-direction: column; gap: 6px; padding: 0 11px 12px; }
  .ap-btn { display: block; padding: 7px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); color: var(--ink); font: 700 13px 'Space Mono', monospace; letter-spacing: .03em; text-align: center; text-decoration: none; line-height: 1.3; }
  .ap-btn:hover { background: var(--pink); color: var(--ink); }
  .ap-btn.alt { background: var(--paper); color: var(--ink); }
  .ap-btn.alt:hover { background: var(--yellow); }
  .ap-card-player { border-bottom: 3px solid var(--ink); }
  .ap-card-player .track { padding: 8px 12px 12px; grid-template-columns: 32px 1fr auto; gap: 10px; }
  .ap-card-player .t-num { display: none; }
  .ap-card-player .track .play { width: 32px; height: 32px; }
  .ap-card-player .t-title { font-size: .85rem; }
  .ap-card-player .t-bar { left: 12px; right: 12px; bottom: 4px; }
  .ap h1 { margin: 0 0 4px; font-family: 'Archivo Black', 'Helvetica Neue', Impact, sans-serif; font-weight: 400; }
  .ap-tagline { margin: 0 0 6px; font: italic 1.25rem 'Newsreader', Georgia, serif; color: var(--ink); }
  .ap-count { font:  17px 'Space Grotesk', 'Helvetica Neue', sans-serif; color: var(--soft); margin: 0 0 20px; }
  .ap-sec { font: 700 14px 'Space Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); margin: 0 0 12px; }
  .ap-hl.is-empty, .ap-hl-col.is-empty, .ap-sec.is-empty { display: none; }
  /* while filtering: each matching genre becomes one row of cards across the page */
  .ap-hl.is-filtered { grid-template-columns: 1fr; gap: 18px; }
  .ap-hl.is-filtered .ap-hl-col { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; align-items: start; }
  .ap-hl.is-filtered .ap-hl-col.is-empty { display: none; }
  .ap-hl.is-filtered .ap-hl-head { grid-column: 1 / -1; }

  /* highlights: one column per genre, each highlighted post a card */
  .ap-hl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin: 0 0 34px; align-items: start; }
  @media (max-width: 900px) { .ap-hl { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .ap-hl { grid-template-columns: 1fr; } }
  .ap-hl-col { display: flex; flex-direction: column; gap: 12px; }
  .ap-hl-head { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--g); font: 700 17px 'Space Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
  .ap-hl-head img { width: 48px; height: 48px; margin: 0; }
  .ap-hl-head span { font-weight: 400; font-size: 13px; color: var(--soft); }
  .ap-card { display: flex; flex-direction: column; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; color: var(--ink); text-decoration: none; box-shadow: 5px 5px 0 var(--g); transition: transform .12s, box-shadow .12s; }
  .ap-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--g); }
  .ap-thumb { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; margin: 0; border-bottom: 3px solid var(--ink); background: var(--g); }
  .ap-thumb.none { display: flex; align-items: center; justify-content: center; }
  .ap-lines { display: block; aspect-ratio: auto; height: auto; padding: 12px 14px; box-sizing: border-box; background: #faf3c8; font: italic .86rem/1.4 'Newsreader', Georgia, 'Times New Roman', serif; color: var(--ink); overflow: hidden; }
  .ap-thumb.none img { width: 64px; height: 64px; margin: 0; }
  .ap-card-body { display: flex; flex-direction: column; gap: 4px; padding: 9px 11px 11px; }
  .ap-card-body b { font-size: .9rem; line-height: 1.3; }
  .ap-card-body time { font: 13px 'Space Mono', monospace; color: var(--soft); }

  /* the list, by year */
  .ap-year { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* kept for screen readers and #y2015 links, not shown */
  .ap-yearblock { border-top: 2px solid rgba(74, 58, 99, .35); }
  .ap-yearblock:first-child { border-top: 0; }
  .ap-list { list-style: none; margin: 0; padding: 0; }
  .ap-item { display: grid; grid-template-columns: 7.2rem 12px 1fr auto; gap: 4px 12px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid rgba(74, 58, 99, .25); }
  .ap-item time { font: 14px 'Space Mono', monospace; color: var(--soft); }
  .ap-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--g); border: 1px solid var(--ink); align-self: center; }
  .ap-item a { font-weight: 700; color: var(--ink); text-decoration: none; }
  .ap-item a:hover { background: var(--yellow); }
  .ap-meta { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .ap-tag { font: 12px 'Space Mono', monospace; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  @media (max-width: 700px) { .ap-item { grid-template-columns: 12px 1fr; } .ap-item time { grid-column: 2; order: -1; } .ap-dot { grid-row: 1 / 3; } .ap-meta { grid-column: 2; justify-content: flex-start; } }
  .ap .is-hidden { display: none; }
  .ap-empty { font: 16px 'Space Mono', monospace; padding: 24px 0; }
  @media (prefers-reduced-motion: reduce) { .ap-card { transition: none; } }


  /* Recents: tiles (default) or, with "Overstimulated? Just words", the plain list */
  .ap-sec-recents small { font-weight: 400; letter-spacing: .06em; text-transform: none; margin-left: 8px; }
  .ap-tthumb { display: none; }
  /* tiles scale with the window: as many ~190px columns as fit, equal heights within a row */
  .recents-tiles #ap-posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 44vw), 1fr)); grid-auto-rows: auto; gap: clamp(10px, 1.6vw, 16px); align-items: stretch; }
  .recents-tiles .ap-yearblock, .recents-tiles .ap-list { display: contents; }
  .recents-tiles .ap-yearblock.is-hidden { display: none; }
  .recents-tiles .ap-item { display: flex; flex-direction: column; padding: 0; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); box-shadow: 5px 5px 0 var(--g); }
  .recents-tiles .ap-item.is-hidden { display: none; }
  /* same hover as the highlight cards: lift up-left, shadow grows */
  .recents-tiles .ap-item { transition: transform .12s, box-shadow .12s; }
  .recents-tiles .ap-item:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--g); }
  .recents-tiles .ap-item a:hover { background: none; }
  @media (prefers-reduced-motion: reduce) { .recents-tiles .ap-item { transition: none; } }
  .recents-tiles .ap-tthumb { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; flex: none; border-bottom: 3px solid var(--ink); background: var(--g); overflow: hidden; }
  .recents-tiles .ap-tthumb img { display: block; width: 100%; height: 100%; object-fit: cover; margin: 0; }
  .recents-tiles .ap-tthumb .none { display: flex; height: 100%; align-items: center; justify-content: center; }
  .recents-tiles .ap-tthumb .none img { width: 56px; height: 56px; object-fit: contain; }
  .recents-tiles .ap-tthumb .ap-lines { height: 100%; }
  .recents-tiles .ap-item time { order: 4; padding: 0 11px 10px; font-size: 13px; }
  /* every tile the same size: long titles stop after three lines */
  .recents-tiles .ap-item > a:not(.ap-tthumb) { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .recents-tiles .ap-dot { display: none; }
  .recents-tiles .ap-item > a:not(.ap-tthumb) { order: 2; padding: 9px 11px 4px; font-size: clamp(.8rem, 1.5vw + .4rem, .95rem); line-height: 1.3; }
  .ap-gtag { display: none; }
  .recents-tiles .ap-meta { display: flex; flex-wrap: nowrap; gap: 6px; order: 3; margin-top: auto; padding: 0 11px 5px; justify-content: space-between; align-items: center; text-align: left; min-width: 0; max-width: 100%; box-sizing: border-box; }
  .recents-tiles .ap-meta .ap-tag, .recents-tiles .ap-gtag { font-size: 9px !important; line-height: 1.5; padding-top: 0; padding-bottom: 0; }
  .recents-tiles .ap-gtag img { width: 12px !important; height: 12px !important; }
  .recents-tiles .ap-gtag { order: 2; flex: none; }   /* genre tag on the right, topic on the left */
  .recents-tiles .ap-meta .ap-tag { order: 1; flex: 0 1 auto; }
  .recents-tiles .ap-meta .ap-tag:not(:nth-child(2)) { display: none; }
  .recents-tiles .ap-gtag { display: inline-flex; align-items: center; gap: 3px; font: 700 12px 'Space Mono', monospace; letter-spacing: .04em; text-transform: uppercase; padding: 0 7px 0 2px; border: 1px solid var(--ink); border-radius: 999px; background: var(--g); color: var(--ink); white-space: nowrap; }
  .recents-tiles .ap-gtag img { width: 16px; height: 16px; margin: 0; }
  .recents-tiles .ap-meta .ap-tag { display: block; box-sizing: border-box; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recents-tiles .ap-empty { grid-column: 1 / -1; }
  .ap-sec-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 0 0 12px; }
  .ap-sec-row .ap-sec { margin: 0; }
  .words-toggle { font: 700 14px 'Space Mono', monospace; letter-spacing: .04em; padding: 7px 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
  .words-toggle:hover { background: #6cc8f0; }
  .ap-sec-row.is-empty { display: none; }
  /* words mode: highlights as plain titles under each genre icon */
  .words .ap-hl-col { gap: 8px; }
  .words .ap-card { display: block; border: 0; border-radius: 0; box-shadow: none; background: none; overflow: visible; }
  .words .ap-card:hover { transform: none; box-shadow: none; }
  .words .ap-thumb, .words .ap-card-player, .words .ap-card-actions, .words .ap-card-body time { display: none; }
  .words .ap-card-body { padding: 0; }
  .words .ap-card-body b { font-size: .92rem; font-weight: 400; line-height: 1.35; text-decoration: underline; text-decoration-color: var(--g); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .words .ap-card:hover .ap-card-body b { background: var(--yellow); }
  .words-toggle[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
  /* phones: two tiles across, a little tighter */
  @media (max-width: 560px) {
    .recents-tiles .ap-item { border-width: 2px; box-shadow: 3px 3px 0 var(--g); border-radius: 10px; }
    .recents-tiles .ap-tthumb { border-bottom-width: 2px; }
    .recents-tiles .ap-item > a:not(.ap-tthumb) { padding: 7px 8px 3px; }
    .recents-tiles .ap-meta { padding: 0 8px 4px; }
    .recents-tiles .ap-item time { padding: 0 8px 8px; font-size: 11px; }
    .recents-tiles .ap-tthumb .none img { width: 40px; height: 40px; }
  }
  .sort-toggle { margin-left: 8px; padding: 1px 8px; border: 1px solid var(--soft); border-radius: 999px; background: none; font: 400 12px 'Space Mono', monospace; letter-spacing: .04em; text-transform: none; color: var(--soft); cursor: pointer; vertical-align: 1px; }
  .sort-toggle:hover { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
</style>

<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="{{ "./favicon.png" | relative_url }}" type="image/x-icon">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body{% if page.genre %} data-genre="{{ page.genre }}"{% endif %}>
    <div class="site-shell">
      {% include rail.html %}

      <div class="site-main">
        <div id="main" role="main" class="container">
          {{ content }}
        </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

      </div>
    </div>

    <script>
      // on phones the pinned list starts folded so the post is visible first
      if (window.matchMedia('(max-width: 820px)').matches) {
        var pinned = document.querySelector('.rail-pinned');
        if (pinned) pinned.removeAttribute('open');
      }
    </script>
    {% unless page.rail == "minimal" or page.rail == "filters" %}
    <script src="{{ site.baseurl }}/js/search-script.js"></script>
    <script>
      SimpleJekyllSearch({
        searchInput: document.getElementById('rail-search-input'),
        resultsContainer: document.getElementById('rail-search-results'),
        json: '{{ site.baseurl }}/search.json',
        searchResultTemplate: '<li><a href="{url}">{title}</a><span>{genre} · {tags}</span></li>',
        noResultsText: '<li class="rail-search-empty">No posts found</li>',
        limit: 12
      });
    </script>
    {% endunless %}

    {% include analytics.html %}
  </body>
</html>
